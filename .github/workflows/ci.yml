name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Subir la imagen a DockerHub'
        type: boolean
        default: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resultados-tests
          path: |
            reports/
            coverage/lcov-report/

      - name: Análisis de calidad
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IMAGEN: ${{ vars.IMAGEN }}
      VERSION: gha-${{ github.run_number }}
      PUBLICAR: ${{ github.event_name == 'push' || inputs.publicar }}
    steps:
      - uses: actions/checkout@v6

      - name: Build imagen
        run: docker build -t "$IMAGEN:$VERSION" .

      - name: Análisis de seguridad
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGEN }}:${{ env.VERSION }}
          version: v0.76.2
          severity: CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Login en DockerHub
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publicar
        if: env.PUBLICAR == 'true'
        run: docker push "$IMAGEN:$VERSION"