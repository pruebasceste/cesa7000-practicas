name: CI
 
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Subir la imagen a DockerHub'
        type: boolean
        default: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
  docker:
  needs: test
  if: github.event_name != 'pull_request'
  runs-on: ubuntu-latest
  env:
    IMAGEN: ${{ vars.IMAGEN }}
    VERSION: gha-${{ github.run_number }}
    PUBLICAR: ${{ github.event_name == 'push' || inputs.publicar }}
  steps:
    - uses: actions/checkout@v6
 
    - name: Build imagen
      run: docker build -t "$IMAGEN:$VERSION" .

    - name: Login en DockerHub
      if: env.PUBLICAR == 'true'
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
 
    - name: Publicar
      if: env.PUBLICAR == 'true'
      run: docker push "$IMAGEN:$VERSION"
      